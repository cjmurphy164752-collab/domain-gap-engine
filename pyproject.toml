[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "domain-gap-engine"
version = "0.1.0"
description = "Local evidence-grounded friction research for configurable hardware and software domains"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
domain-gap = "opportunity_engine.domain_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opportunity_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
